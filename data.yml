name: Mettre à jour data.json
on:
  workflow_dispatch:      # bouton "Run workflow" manuel
  schedule:
    - cron: "0 4 * * 1"   # puis automatiquement chaque lundi
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python prep.py
      - name: Enregistrer data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "Mise à jour des horaires TEC" || echo "Rien à changer"
          git push
